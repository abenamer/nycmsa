# Local deployment: PostgreSQL on a named volume, a one-shot bootstrap that
# fills it, and the web app.
#
#   docker compose up --build
#   open http://127.0.0.1:8080   (or NYCMSA_PORT=8090 docker compose up --build)
#
# Everything the app reads lives in PostgreSQL: simulation runs, the
# MySchools catalog, state test results, the hand-entered programs, and
# the form defaults. The data files live in the named volume
# `nycmsa_pgdata`, so `docker compose down` and image rebuilds keep them.
# Never run `docker compose down -v` against data you want to keep: `-v`
# deletes the named volume. See docs/operations.md for backup and restore.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: nycmsa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nycmsa}
      POSTGRES_DB: nycmsa
    volumes:
      - nycmsa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nycmsa -d nycmsa"]
      interval: 5s
      timeout: 3s
      retries: 10
    # The database port stays inside the Compose network.

  # Imports the seed files and downloads the catalog and test results when
  # the database lacks them. Re-run `docker compose run --rm init fetch`
  # or `... fetch-scores` to add a newer snapshot.
  init:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://nycmsa:${POSTGRES_PASSWORD:-nycmsa}@db:5432/nycmsa
      RUST_LOG: info
    command: ["bootstrap"]

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://nycmsa:${POSTGRES_PASSWORD:-nycmsa}@db:5432/nycmsa
      RUST_LOG: info
    ports:
      # Loopback only: every endpoint is anonymous. Set NYCMSA_PORT to use
      # another host port, for example NYCMSA_PORT=8090 docker compose up -d
      - "127.0.0.1:${NYCMSA_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  nycmsa_pgdata:
