name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/check_docs.py
      - run: python -m unittest discover -s tests -v

  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nycmsa
          POSTGRES_PASSWORD: nycmsa
          POSTGRES_DB: nycmsa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nycmsa -d nycmsa_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: PostgreSQL integration test
        env:
          NYCMSA_TEST_DATABASE_URL: postgres://nycmsa:nycmsa@127.0.0.1:5432/nycmsa_test
        run: cargo test --locked --test postgres_reference -- --ignored
      - name: Dependency audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nycmsa:ci .
      - run: docker run --rm nycmsa:ci sim --trials 1000 --seed 1

  # Publishes the image the server pulls. It runs only for a push to main
  # and only after every other job passed. The `production` environment
  # is the second gate: its deployment-branch policy in the repository
  # settings must allow `main` only, so a workflow edit on another branch
  # cannot reach the write token. The build job above never holds that
  # token.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docs, rust, docker]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t "$IMAGE:latest" -t "$IMAGE:sha-${GITHUB_SHA::7}" .
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: docker push --all-tags "$IMAGE"
