name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/check_docs.py
      - run: python -m unittest discover -s tests -v

  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nycmsa
          POSTGRES_PASSWORD: nycmsa
          POSTGRES_DB: nycmsa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nycmsa -d nycmsa_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: PostgreSQL integration test
        env:
          NYCMSA_TEST_DATABASE_URL: postgres://nycmsa:nycmsa@127.0.0.1:5432/nycmsa_test
        run: cargo test --locked --test postgres_reference -- --ignored
      - name: Dependency audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nycmsa:ci .
      - run: docker run --rm nycmsa:ci sim --trials 1000 --seed 1

  # Publishes the image the server pulls. It runs only for a push to main
  # and only after every other job passed. The `production` environment
  # is the second gate: its deployment-branch policy in the repository
  # settings must allow `main` only, so a workflow edit on another branch
  # cannot reach the write token. The build job above never holds that
  # token.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docs, rust, docker]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t "$IMAGE:latest" -t "$IMAGE:sha-${GITHUB_SHA::7}" .
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: docker push --all-tags "$IMAGE"

  # Runs update.sh on the server over SSH once the image is published. The
  # key is accepted only for `sudo /opt/nycmsa/update.sh` (see
  # deploy/add-deploy-key.sh). Without the DEPLOY_HOST secret the job
  # reports that and passes; the server then updates itself at 04:17 UTC.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish]
    runs-on: ubuntu-latest
    environment: production
    permissions: {}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Explain a skipped deploy
        if: env.DEPLOY_HOST == ''
        run: echo "No DEPLOY_HOST secret in the production environment; the server pulls the image itself at 04:17 UTC."
      - name: Run update.sh on the server
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 "deploy@$DEPLOY_HOST"
