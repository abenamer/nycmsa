[package]
name = "nycmsa"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "NYC middle school admissions Monte Carlo with a web interface"
publish = false

[[bin]]
name = "nycmsa"
path = "src/main.rs"

[dependencies]
askama = "0.14"
async-trait = "0.1"
axum = { version = "0.8", features = ["form", "json", "query"] }
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
regex = "1"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "time", "migrate", "macros"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "net", "time"] }
tower-http = { version = "0.6", features = ["timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
